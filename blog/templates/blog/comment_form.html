{% extends "base.html" %}

{% block title %}Comentar{% endblock %}

{% block content %}
  <h1>Novo comentário</h1>
  <p class="meta">Comentando em: <a href="{% url 'blog:post_detail' post.pk %}">{{ post.title }}</a> · como <strong>{{ user.username }}</strong></p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="btn" type="submit">Publicar comentário</button>
      <a class="btn secondary" href="{% url 'blog:post_detail' post.pk %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
