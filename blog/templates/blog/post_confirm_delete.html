{% extends "base.html" %}

{% block title %}Remover post{% endblock %}

{% block content %}
  <h1>Remover post</h1>
  <p>Tem certeza que deseja remover o post <strong>"{{ post.title }}"</strong>? Esta ação não pode ser desfeita.</p>
  <form method="post">
    {% csrf_token %}
    <div class="actions">
      <button class="btn danger" type="submit">Sim, remover</button>
      <a class="btn secondary" href="{% url 'blog:post_detail' post.pk %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
