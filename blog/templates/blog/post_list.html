{% extends "base.html" %}

{% block title %}Posts{% endblock %}

{% block content %}
  <h1>Posts</h1>
  <a class="btn" href="{% url 'blog:post_create' %}">Criar novo post</a>
  <ul class="post-list">
    {% for post in post_list %}
      <li>
        <a href="{% url 'blog:post_detail' post.pk %}">{{ post.title }}</a>
        <div class="meta">{{ post.date|date:"d/m/Y H:i" }}</div>
      </li>
    {% empty %}
      <li>Nenhum post publicado ainda.</li>
    {% endfor %}
  </ul>
{% endblock %}
